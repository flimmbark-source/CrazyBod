name: Apply authored world

on:
  push:
    branches: [feature/authored-3d-day-sequence]
    paths:
      - scripts/apply-authored-world.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/authored-3d-day-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-authored-world.mjs
      - run: |
          rm scripts/apply-authored-world.mjs
          rm .github/workflows/apply-authored-world.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wire authored 3d day sequence"
          git push
