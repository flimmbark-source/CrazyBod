name: Apply café narrative Beat

on:
  push:
    branches:
      - feature/cafe-narrative-beat
    paths:
      - .github/workflows/apply-cafe-beat.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cafe-narrative-beat
          fetch-depth: 0

      - name: Apply controller integration
        run: python .github/apply_cafe_beat.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Remove temporary applicator
        run: rm .github/apply_cafe_beat.py .github/workflows/apply-cafe-beat.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add fixed café rupture narrative Beat"
          git push origin HEAD:feature/cafe-narrative-beat
