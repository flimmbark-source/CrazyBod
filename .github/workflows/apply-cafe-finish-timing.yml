name: Apply cafe finish timing

on:
  push:
    branches:
      - feature/cafe-narrative-beat
    paths:
      - .github/workflows/apply-cafe-finish-timing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cafe-narrative-beat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python tools/apply_cafe_finish_timing.py
      - run: npm test
      - run: npm run build
      - name: Commit validated finish timing changes
        run: |
          rm tools/apply_cafe_finish_timing.py
          rm .github/workflows/apply-cafe-finish-timing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cafe door linger and completion celebration"
          git push origin HEAD:feature/cafe-narrative-beat
