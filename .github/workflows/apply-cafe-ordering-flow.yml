name: Apply café ordering flow

on:
  push:
    branches: [fix/orchestrate-cafe-order-and-seating]
    paths:
      - .github/cafe-ordering-branch-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-cafe-ordering-flow.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "orchestrate café ordering and seating"
          git push
