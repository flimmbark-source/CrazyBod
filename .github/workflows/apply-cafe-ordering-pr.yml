name: Apply café ordering PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/apply-cafe-ordering-flow.mjs

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/world/JourneyScene.jsx')
          text = path.read_text()
          text = text.replace(
              '      </group>\n\n\n      <group position={[-4.25, 0, -84.8]}>',
              '      </group>\n\n      <group position={[-4.25, 0, -84.8]}>',
          )
          path.write_text(text)
          PY
      - id: apply
        continue-on-error: true
        run: node scripts/apply-cafe-ordering-flow.mjs > /tmp/cafe-ordering.log 2>&1
      - if: steps.apply.outcome == 'failure'
        run: |
          cp /tmp/cafe-ordering.log .github/cafe-ordering-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/cafe-ordering-error.txt
          git commit -m "capture café ordering patch error"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
      - if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/cafe-ordering-error.txt 2>/dev/null || true
          git add src/App.jsx src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "orchestrate café ordering and seating"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
