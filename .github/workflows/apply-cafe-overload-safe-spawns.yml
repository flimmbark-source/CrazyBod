name: Apply cafe overload and safe spawn pass

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'feature/cafe-overload-safe-spawns'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
      - name: Apply source changes
        run: python .github/scripts/apply-cafe-overload-safe-spawns.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "improve cafe enclosure and overload feedback"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
