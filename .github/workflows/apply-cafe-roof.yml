name: Apply cafe roof restoration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'fix/restore-cafe-roof-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
      - name: Restore cafe roof
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/world/JourneyScene.jsx')
          source = path.read_text()
          floor = '      <Box position={[0, -0.12, -87]} size={[14, 0.24, 27]} color="#8a725f" />'
          roof = '''      <Box position={[0, 5.48, -87]} size={[14.5, 0.32, 27.5]} color="#4d4146" castShadow={false} receiveShadow={false} />
          <Box position={[0, 5.68, -87]} size={[15.0, 0.12, 28.0]} color="#3e3840" castShadow={false} receiveShadow={false} />'''
          if roof in source:
              raise SystemExit(0)
          if floor not in source:
              raise SystemExit('Could not find cafe floor')
          path.write_text(source.replace(floor, floor + '\n' + roof, 1))
          PY
      - name: Commit roof restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "restore cafe roof"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
