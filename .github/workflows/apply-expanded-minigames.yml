name: Apply expanded minigames

on:
  push:
    branches: [feature/twenty-new-minigames]
    paths:
      - scripts/apply-expanded-minigames.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twenty-new-minigames
      - run: node scripts/apply-expanded-minigames.mjs
      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/microgameEnhancements.js
          git commit -m "integrate expanded minigame catalog"
          git push origin HEAD:feature/twenty-new-minigames
