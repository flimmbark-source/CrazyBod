name: Apply fatigue layout fix

on:
  push:
    branches: [prototype/variation-focus-pass-v2]
    paths:
      - scripts/apply-fatigue-layout-fix.mjs
      - .github/workflows/apply-fatigue-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/variation-focus-pass-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-fatigue-layout-fix.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix fatigue control obstruction"
          git push origin HEAD:prototype/variation-focus-pass-v2
