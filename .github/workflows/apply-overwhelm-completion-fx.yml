name: Apply overwhelm completion FX

on:
  push:
    branches: [prototype/rapid-overwhelm-completion-fx]
    paths:
      - scripts/apply-overwhelm-completion-fx.mjs
      - .github/workflows/apply-overwhelm-completion-fx.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/rapid-overwhelm-completion-fx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-overwhelm-completion-fx.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx
          git commit -m "accelerate overwhelm and add completion bursts"
          git push origin HEAD:prototype/rapid-overwhelm-completion-fx

# Follow-up commit ensures the branch workflow is registered before execution.
