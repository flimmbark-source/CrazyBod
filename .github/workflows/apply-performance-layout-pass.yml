name: Apply performance layout pass

on:
  push:
    branches: [performance/minigame-layout-pass]
    paths:
      - scripts/apply-performance-layout-pass.mjs
      - .github/workflows/apply-performance-layout-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/minigame-layout-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-performance-layout-pass.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/compat.css src/styles.css src/minigames.css src/minigames/shared.jsx src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "improve runtime performance and normalize minigame layout"
          git push
