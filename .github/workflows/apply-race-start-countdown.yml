name: Apply race start countdown

on:
  push:
    branches: [feature/race-start-countdown]
    paths:
      - scripts/apply-race-start-countdown.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/race-start-countdown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-race-start-countdown.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx
          git diff --cached --quiet || git commit -m "add race start cue and countdown timer"
          git push
