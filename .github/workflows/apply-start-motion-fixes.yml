name: Apply start motion and minigame fixes

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-start-motion-fixes.mjs
      - .github/workflows/apply-start-motion-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/start-motion-and-minigame-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escape embedded JSX templates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-start-motion-fixes.mjs')
          source = path.read_text()
          source = source.replace('${marker}%', r'\${marker}%')
          source = source.replace('${position.x}%', r'\${position.x}%')
          source = source.replace('${position.y}%', r'\${position.y}%')
          path.write_text(source)
          PY
      - run: node scripts/apply-start-motion-fixes.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/world/JourneyScene.jsx src/minigames/physical.jsx src/minigames.css
          git diff --cached --quiet || git commit -m "start movement immediately and clarify physical minigames"
          git push
