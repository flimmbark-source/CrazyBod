name: Apply tutorial safe callouts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/tutorial-safe-callouts-trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'feature/tutorial-safe-callouts'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
      - name: Add tutorial progression helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          source = path.read_text()
          if 'const advanceTutorial = () =>' not in source:
              anchor = "  const tutorialTarget = tutorialStep === 'first' || tutorialStep === 'second'"
              helper = """  const advanceTutorial = () => {
            if (tutorialStep === 'home') {
              setTutorialStep('summary')
              return
            }
            finishTutorial()
          }

          """
              if anchor not in source:
                  raise SystemExit('Could not find tutorial target anchor')
              source = source.replace(anchor, helper + anchor, 1)
          path.write_text(source)
          PY
      - name: Commit helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "complete go home tutorial progression"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
