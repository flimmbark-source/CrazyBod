name: Apply variation pass

on:
  push:
    branches: [prototype/variation-pass]
    paths:
      - scripts/apply-variation-pass.mjs
      - .github/workflows/apply-variation-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/variation-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-variation-pass.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx
          git commit -m "implement microgame variations and keyboard focus"
          git push origin HEAD:prototype/variation-pass
