name: Run doorway and Mara fix

on:
  push:
    branches: [main]
    paths:
      - .github/doorway-and-mara-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/open-doorways-and-meet-mara-outside
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-doorway-and-mara-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "open the doorways and meet Mara outside"
          git push origin HEAD:fix/open-doorways-and-meet-mara-outside
