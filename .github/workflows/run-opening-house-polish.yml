name: Run opening house polish

on:
  push:
    branches: [main]
    paths:
      - .github/opening-house-polish-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opening-house-door-hitch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-opening-house-polish.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css src/world/JourneyScene.jsx
          git diff --cached --quiet || git commit -m "polish the opening house and door sequence"
          git push origin HEAD:fix/opening-house-door-hitch
